apiVersion: harness.io/v1
kind: Workflow
identifier: jarvis_onboarding_promotion_step1
name: Onboarding - Promotion Step 1
type: service
owner: platform_engineering
metadata:
  orgIdentifier: idp_sandbox_dev
  projectIdentifier: idp_project
  description: >
    JARVIS self-service onboarding promotion. Promotes an application from one
    environment to the next. Captures cloud type, division, region, DMND ticket,
    environment, qualys scan, rehydration strategy, Bifrost category, and all
    web and app tier definitions.
  tags:
    - jarvis
    - onboarding
    - promotion
    - self-service
  icon: cloud
  actionButton:
    intent: success
    text: Submit Promotion

spec:

  parameters:

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 1 — Promotion Details (Section A)
    # Validated against Jarvis lookup on submission.
    # ══════════════════════════════════════════════════════════════════════════
    - title: Promotion Details
      description: >
        Complete all fields below. A clean Qualys scan is required before
        promotion can proceed.

      required:
        - applicationId
        - cloudType
        - division
        - promotedFromRegion
        - demandTicket
        - promotedFromEnviroment
        - qualysScan
        - elaborationProcess
        - applicationStage

      properties:

        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken

        applicationId:
          title: 'What is your application ID? *'
          type: string
          description: 'Format: SYSID-##### — 5-digit number after the prefix'
          default: 'SYSID-06534'
          ui:autofocus: true
          ui:placeholder: 'Application ID - e.g. SYSID-06534'
          pattern: '^SYSID-[0-9]{5}$'
          minLength: 11
          maxLength: 11

        cloudType:
          title: 'Select your cloud type *'
          type: string
          description: 'Public cloud provider for this promotion'
          enum:
            - AWS
            - Azure
          ui:widget: select

        division:
          title: 'Select deployment division *'
          type: string
          description: 'Business division that owns the infrastructure'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/divisions
            valueSelector: value
            labelSelector: label

        promotedFromRegion:
          title: 'Select a promoted from region *'
          type: string
          description: 'The region you are promoting from'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/regions
            valueSelector: value
            labelSelector: label

        demandTicket:
          title: 'What is your DMND ticket number? *'
          type: string
          description: 'ServiceNow DMND ticket — e.g. DMND123456789'
          default: 'DMND1234567890'
          ui:placeholder: 'DMND Ticket - e.g. DMND1234556'
          pattern: '^DMND[0-9A-Z]+$'

        # API field name has a deliberate typo (single n) — matches Jarvis exactly
        promotedFromEnviroment:
          title: 'Select a promoted from environment *'
          type: string
          description: 'The environment you are promoting from'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/environments
            valueSelector: value
            labelSelector: label

        qualysScan:
          title: 'Have you submitted for a Qualys scan? *'
          type: string
          description: 'Must be Yes to proceed — a clean Qualys scan is required'
          enum:
            - 'Yes'
            - 'No'
          ui:widget: select

        elaborationProcess:
          title: 'Will your application be rehydratable or patch in place? *'
          type: string
          description: 'Select the deployment strategy for your application'
          enum:
            - Rehydration
            - PatchInPlace
          ui:widget: select

        applicationStage:
          title: 'Categorisation on Bifrost? *'
          type: string
          description: 'Select the Bifrost application category that applies'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/bifrost-categories
            valueSelector: value
            labelSelector: label

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 2 — Application Configuration (Section B)
    # ══════════════════════════════════════════════════════════════════════════
    - title: Application Configuration
      description: >
        Configure your application resources, VPCs, and networking.

      required:
        - applicationName
        - environment
        - multiRegionDeployment
        - bitbucketProjectKey
        - assignmentGroup

      properties:

        isOnboardingSkipped:
          title: 'Skip entire onboarding resource creation?'
          description: 'Toggle ON only if you want to skip the onboarding resources creation entirely'
          type: boolean
          default: false

        applicationName:
          title: 'Application name *'
          type: string
          description: 'e.g. EPCloud-Training-AWS'
          default: 'EPCloud-Training-AWS'
          ui:placeholder: 'Application Name - e.g. EPCloud-Training-AWS'

        environment:
          title: 'Which environment do you want to promote to? *'
          type: string
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/promote-to-environments
            valueSelector: value
            labelSelector: label

        multiRegionDeployment:
          title: 'Select deployment region(s) *'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select one or more regions to deploy to'
          items:
            type: string
            enum:
              - us-east-1
              - us-east-2
              - us-west-2
              - eu-west-1
              - eu-central-1
              - eastus
              - eastus2
              - westeurope

        bitbucketProjectKey:
          title: 'Bitbucket project key *'
          type: string
          description: 'e.g. QNA'
          default: 'QNA'
          ui:placeholder: 'Bitbucket Project Key - e.g. QNA'

        isS3Required:
          title: 'Do you need S3?'
          type: boolean
          default: false

        isSqsRequired:
          title: 'Do you need SQS (KMS KEY)?'
          type: boolean
          default: false

        networkConnectivity:
          title: 'Enterprise applications (optional)'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select enterprise applications this service needs to reach'
          items:
            type: string
            enum:
              - EnterpriseApp-1
              - EnterpriseApp-2
              - EnterpriseApp-3

        lamAddonServices:
          title: 'Add-ons (optional)'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select any LAM add-on services required'
          items:
            type: string
            enum:
              - Addon-1
              - Addon-2
              - Addon-3

        internalVpc:
          title: 'Select internal VPC'
          type: string
          description: 'If you do not know, select default'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/vpc-options
            valueSelector: value
            labelSelector: label

        ingressVpc:
          title: 'Select ingress VPC'
          type: string
          description: 'If you do not know, select default'
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/hoover-service/mock-api/jarvis/promotion/vpc-options
            valueSelector: value
            labelSelector: label

        assignmentGroup:
          title: 'Assignment group *'
          type: string
          description: 'e.g. Workload_Cloud_Tools'
          default: 'Workload_Cloud_Tools'
          ui:placeholder: 'Assignment Group - e.g. Workload_Cloud_Tools'

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 3 — Web Tiers
    # Each item = one web tier. Add/remove as needed.
    # ══════════════════════════════════════════════════════════════════════════
    - title: Define Web Tiers
      description: >
        Add one entry per web tier. In production 2-3 tiers is typical.
        Leave empty if no web tiers are required.

      properties:

        webs:
          title: 'Web Tier(s)'
          type: array
          description: 'Select the web tier repositories to promote. Add one entry per web tier.'
          items:
            type: string
            ui:field: SelectFieldFromApi
            ui:options:
              path: proxy/hoover-service/mock-api/jarvis/promotion/webtier-options
              valueSelector: value
              labelSelector: label
              placeholder: 'Select web tier repository...'

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 4 — App Tiers + Submit
    # Identical item schema to web tiers.
    # ══════════════════════════════════════════════════════════════════════════
    - title: Define App Tiers & Submit
      description: >
        Add one entry per app tier. Leave empty if no app tiers are required.

      properties:

        apps:
          title: 'App Tier(s)'
          type: array
          description: 'Select the app tier repositories to promote. Add one entry per app tier.'
          items:
            type: string
            ui:field: SelectFieldFromApi
            ui:options:
              path: proxy/hoover-service/mock-api/jarvis/promotion/apptier-options
              valueSelector: value
              labelSelector: label
              placeholder: 'Select app tier repository...'

        isDbTier:
          title: 'Do you have a Database tier?'
          type: boolean
          default: false

  # ─────────────────────────────────────────────────────────────────────────
  # STEPS
  # ─────────────────────────────────────────────────────────────────────────
  steps:
    - id: trigger_pipeline
      name: Submit Promotion Request
      action: trigger:harness-custom-pipeline
      input:
        url: https://app.harness.io/ng/account/ACCOUNT_ID/module/idp/orgs/idp_sandbox_dev/projects/idp_project/pipelines/jarvis_onboarding_promotion_step1
        inputset:
          applicationId:          ${{ parameters.applicationId }}
          cloudType:              ${{ parameters.cloudType }}
          division:               ${{ parameters.division }}
          promotedFromRegion:     ${{ parameters.promotedFromRegion }}
          demandTicket:           ${{ parameters.demandTicket }}
          promotedFromEnviroment: ${{ parameters.promotedFromEnviroment }}
          qualysScan:             ${{ parameters.qualysScan }}
          elaborationProcess:     ${{ parameters.elaborationProcess }}
          applicationStage:       ${{ parameters.applicationStage }}
          isOnboardingSkipped:    ${{ parameters.isOnboardingSkipped }}
          applicationName:        ${{ parameters.applicationName }}
          environment:            ${{ parameters.environment }}
          multiRegionDeployment:  ${{ parameters.multiRegionDeployment }}
          bitbucketProjectKey:    ${{ parameters.bitbucketProjectKey }}
          isS3Required:           ${{ parameters.isS3Required }}
          isSqsRequired:          ${{ parameters.isSqsRequired }}
          networkConnectivity:    ${{ parameters.networkConnectivity }}
          lamAddonServices:       ${{ parameters.lamAddonServices }}
          internalVpc:            ${{ parameters.internalVpc }}
          ingressVpc:             ${{ parameters.ingressVpc }}
          assignmentGroup:        ${{ parameters.assignmentGroup }}
          webs:                   ${{ parameters.webs }}
          apps:                   ${{ parameters.apps }}
          isDbTier:               ${{ parameters.isDbTier }}
        showOutputVariables: true

  # ─────────────────────────────────────────────────────────────────────────
  # OUTPUT
  # ─────────────────────────────────────────────────────────────────────────
  output:
    links:
      - title: View Pipeline Execution
        url: ${{ steps.trigger_pipeline.output.PipelineUrl }}
        icon: scaffolder
    text:
      - title: Promotion Request Submitted
        content: |
          Your promotion request has been submitted successfully.

          **Section A**

          | Field | Value |
          |---|---|
          | Application ID | `${{ parameters.applicationId }}` |
          | Cloud Type | `${{ parameters.cloudType }}` |
          | Division | `${{ parameters.division }}` |
          | Promoted From Region | `${{ parameters.promotedFromRegion }}` |
          | DMND Ticket | `${{ parameters.demandTicket }}` |
          | Promoted From Environment | `${{ parameters.promotedFromEnviroment }}` |
          | Qualys Scan | `${{ parameters.qualysScan }}` |
          | Elaboration Process | `${{ parameters.elaborationProcess }}` |
          | Application Stage | `${{ parameters.applicationStage }}` |

          **Section B**

          | Field | Value |
          |---|---|
          | Application Name | `${{ parameters.applicationName }}` |
          | Target Environment | `${{ parameters.environment }}` |
          | Bitbucket Project Key | `${{ parameters.bitbucketProjectKey }}` |
          | Assignment Group | `${{ parameters.assignmentGroup }}` |
          | S3 Required | `${{ parameters.isS3Required }}` |
          | SQS Required | `${{ parameters.isSqsRequired }}` |
          | Internal VPC | `${{ parameters.internalVpc }}` |
          | Ingress VPC | `${{ parameters.ingressVpc }}` |
          | DB Tier | `${{ parameters.isDbTier }}` |
