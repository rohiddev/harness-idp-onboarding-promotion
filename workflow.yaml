apiVersion: harness.io/v1
kind: Workflow
identifier: jarvis_onboarding_promotion_step1
name: Onboarding - Promotion Step 1
type: service
owner: platform_engineering
metadata:
  orgIdentifier: idp_sandbox_dev
  projectIdentifier: idp_project
  description: >
    JARVIS self-service onboarding promotion. Promotes an application from one
    environment to the next. Captures cloud type, division, region, DMND ticket,
    environment, qualys scan, rehydration strategy, Bifrost category, and all
    web and app tier definitions.
  tags:
    - jarvis
    - onboarding
    - promotion
    - self-service
  icon: cloud
  actionButton:
    intent: success
    text: Submit Promotion

spec:

  parameters:

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 1 — Promotion Details (Section A)
    # Validated against Jarvis lookup on submission.
    # ══════════════════════════════════════════════════════════════════════════
    - title: Promotion Details
      description: >
        Complete all fields below. A clean Qualys scan is required before
        promotion can proceed.

      required:
        - applicationId
        - cloudType
        - division
        - promotedFromRegion
        - demandTicket
        - promotedFromEnviroment
        - qualysScan
        - elaborationProcess
        - applicationStage

      properties:

        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken

        applicationId:
          title: 'What is your application ID? *'
          type: string
          description: 'Format: SYSID-##### — 5-digit number after the prefix'
          default: 'SYSID-'
          ui:autofocus: true
          ui:placeholder: 'Application ID - e.g. SYSID-06534'
          pattern: '^SYSID-[0-9]{5}$'
          minLength: 11
          maxLength: 11

        cloudType:
          title: 'Select your cloud type *'
          type: string
          description: 'Public cloud provider for this promotion'
          enum:
            - AWS
            - Azure
          ui:widget: select

        division:
          title: 'Select deployment division *'
          type: string
          description: 'Business division that owns the infrastructure'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/divisions'
            valueSelector: value
            labelSelector: label
            placeholder: 'Deployment Division - Select a division...'

        promotedFromRegion:
          title: 'Select a promoted from region *'
          type: string
          description: 'The region you are promoting from'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/regions'
            valueSelector: value
            labelSelector: label
            placeholder: 'Region - Select a region...'

        demandTicket:
          title: 'What is your DMND ticket number? *'
          type: string
          description: 'ServiceNow DMND ticket — e.g. DMND123456789'
          ui:placeholder: 'DMND Ticket - e.g. DMND1234556'
          pattern: '^DMND[0-9A-Z]+$'

        # API field name has a deliberate typo (single n) — matches Jarvis exactly
        promotedFromEnviroment:
          title: 'Select a promoted from environment *'
          type: string
          description: 'The environment you are promoting from'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/environments'
            valueSelector: value
            labelSelector: label
            placeholder: 'Environment - Select an environment...'

        qualysScan:
          title: 'Have you submitted for a Qualys scan? *'
          type: string
          description: 'Must be Yes to proceed — a clean Qualys scan is required'
          enum:
            - 'Yes'
            - 'No'
          ui:widget: select

        elaborationProcess:
          title: 'Will your application be rehydratable or patch in place? *'
          type: string
          description: 'Select the deployment strategy for your application'
          enum:
            - Rehydration
            - PatchInPlace
          ui:widget: select

        applicationStage:
          title: 'Categorisation on Bifrost? *'
          type: string
          description: 'Select the Bifrost application category that applies'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/bifrost-categories'
            valueSelector: value
            labelSelector: label
            placeholder: 'Bifrost Category - Select a category...'

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 2 — Application Configuration (Section B)
    # ══════════════════════════════════════════════════════════════════════════
    - title: Application Configuration
      description: >
        Configure your application resources, VPCs, and networking.

      required:
        - applicationName
        - environment
        - multiRegionDeployment
        - bitbucketProjectKey
        - assignmentGroup

      properties:

        isOnboardingSkipped:
          title: 'Skip entire onboarding resource creation?'
          description: 'Toggle ON only if you want to skip the onboarding resources creation entirely'
          type: boolean
          default: false

        applicationName:
          title: 'Application name *'
          type: string
          description: 'e.g. EPCloud-Training-AWS'
          ui:placeholder: 'Application Name - e.g. EPCloud-Training-AWS'

        environment:
          title: 'Which environment do you want to promote to? *'
          type: string
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/promote-to-environments'
            valueSelector: value
            labelSelector: label
            placeholder: 'Target Environment - Select...'

        multiRegionDeployment:
          title: 'Select deployment region(s) *'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select one or more regions to deploy to'
          items:
            type: string
            enum:
              - us-east-1
              - us-east-2
              - us-west-2
              - eu-west-1
              - eu-central-1
              - eastus
              - eastus2
              - westeurope

        bitbucketProjectKey:
          title: 'Bitbucket project key *'
          type: string
          description: 'e.g. QNA'
          ui:placeholder: 'Bitbucket Project Key - e.g. QNA'

        isS3Required:
          title: 'Do you need S3?'
          type: boolean
          default: false

        isSqsRequired:
          title: 'Do you need SQS (KMS KEY)?'
          type: boolean
          default: false

        networkConnectivity:
          title: 'Enterprise applications (optional)'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select enterprise applications this service needs to reach'
          items:
            type: string
            enum:
              - EnterpriseApp-1
              - EnterpriseApp-2
              - EnterpriseApp-3

        lamAddonServices:
          title: 'Add-ons (optional)'
          type: array
          uniqueItems: true
          ui:widget: checkboxes
          description: 'Select any LAM add-on services required'
          items:
            type: string
            enum:
              - Addon-1
              - Addon-2
              - Addon-3

        internalVpc:
          title: 'Select internal VPC'
          type: string
          description: 'If you do not know, select default'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/vpc-options'
            valueSelector: value
            labelSelector: label
            placeholder: 'Internal VPC - default'

        ingressVpc:
          title: 'Select ingress VPC'
          type: string
          description: 'If you do not know, select default'
          ui:field: SelectFieldFromApi
          ui:options:
            path: 'proxy/platform-api/hoover-service/mock-api/jarvis/promotion/vpc-options'
            valueSelector: value
            labelSelector: label
            placeholder: 'Ingress VPC - default'

        assignmentGroup:
          title: 'Assignment group *'
          type: string
          description: 'e.g. Workload_Cloud_Tools'
          ui:placeholder: 'Assignment Group - e.g. Workload_Cloud_Tools'

    # ══════════════════════════════════════════════════════════════════════════
    # PAGE 3 — Web Tiers
    # Each item = one web tier. Add/remove as needed.
    # ══════════════════════════════════════════════════════════════════════════
    - title: Define Web Tiers
      description: >
        Add one entry per web tier. In production 2-3 tiers is typical.
        Leave empty if no web tiers are required.

      properties:

        webs:
          title: 'Web Tier(s)'
          type: array
          minItems: 0
          default:
            - repositoryName: web-tier-repo-1
              os: Linux
              bitbucketProjectKey: QNA
              isNotForPromotion: false
              isBifrost: true
              isServerlessPattern: false
              isS3Only: false
              isPublicFacing: true
              instanceSize: Medium
              numOfInstances: '2'
              volumeType: gp3
              volumeSize: '40'
              isAutoScaling: true
              isStaticIp: false
              loadbalancer: ALB
              isFsx: false
              isEfs: false
              isElasticacheRedis: false
            - repositoryName: web-tier-repo-2
              os: Linux
              bitbucketProjectKey: QNA
              isNotForPromotion: false
              isBifrost: true
              isServerlessPattern: false
              isS3Only: false
              isPublicFacing: true
              instanceSize: Large
              numOfInstances: '3'
              volumeType: gp3
              volumeSize: '60'
              isAutoScaling: true
              isStaticIp: false
              loadbalancer: NLB
              isFsx: false
              isEfs: false
              isElasticacheRedis: false
            - repositoryName: web-tier-repo-3
              os: Windows
              bitbucketProjectKey: QNA
              isNotForPromotion: false
              isBifrost: true
              isServerlessPattern: false
              isS3Only: false
              isPublicFacing: false
              instanceSize: Small
              numOfInstances: '1'
              volumeType: gp3
              volumeSize: '40'
              isAutoScaling: false
              isStaticIp: true
              loadbalancer: None
              isFsx: false
              isEfs: false
              isElasticacheRedis: false
          ui:options:
            addable: true
            removable: true
            orderable: true
          items:
            type: object
            required:
              - repositoryName
              - os
            properties:

              repositoryName:
                title: 'Bifrost Bitbucket repository name *'
                type: string
                ui:placeholder: 'Repository Name'

              os:
                title: 'Windows or Linux? *'
                type: string
                enum:
                  - Linux
                  - Windows
                ui:widget: select

              bitbucketProjectKey:
                title: 'Bitbucket project key (per tier)'
                type: string
                ui:placeholder: 'e.g. QNA'

              isNotForPromotion:
                title: 'Skip promotion for this tier?'
                description: 'Toggle ON to exclude this tier from promotion'
                type: boolean
                default: false

              isBifrost:
                title: 'Onboard via Bifrost?'
                type: boolean
                default: true

              isServerlessPattern:
                title: 'Lambda pattern only?'
                type: boolean
                default: false

              isS3Only:
                title: 'S3 only?'
                type: boolean
                default: false

              isPublicFacing:
                title: 'Will this web tier be public facing?'
                type: boolean
                default: false

              instanceSize:
                title: 'Instance size'
                type: string
                default: Medium
                enum:
                  - Small
                  - Medium
                  - Large
                ui:widget: select

              numOfInstances:
                title: 'Number of instances'
                type: string
                default: '1'
                ui:placeholder: 'e.g. 1'

              volumeType:
                title: 'Volume type'
                type: string
                default: gp3
                enum:
                  - gp3
                  - io2
                ui:widget: select

              volumeSize:
                title: 'Volume size (GB)'
                type: string
                default: '40'
                ui:placeholder: 'e.g. 40'

              isAutoScaling:
                title: 'Autoscaling?'
                type: boolean
                default: false

              isStaticIp:
                title: 'Static IP?'
                type: boolean
                default: false

              loadbalancer:
                title: 'Load balancer type'
                type: string
                default: None
                enum:
                  - None
                  - ALB
                  - NLB
                ui:widget: select

              isFsx:
                title: 'Require FSX?'
                type: boolean
                default: false

              isEfs:
                title: 'Require EFS?'
                type: boolean
                default: false

              isElasticacheRedis:
                title: 'Require ElastiCache Redis?'
                type: boolean
                default: false

