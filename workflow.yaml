  # ─────────────────────────────────────────────────────────────────────────
  # STEPS
  # ─────────────────────────────────────────────────────────────────────────
  steps:
    - id: trigger_pipeline
      name: Submit Promotion Request
      action: trigger:harness-custom-pipeline
      input:
        url: https://app.harness.io/ng/account/ACCOUNT_ID/module/idp/orgs/idp_sandbox_dev/projects/idp_project/pipelines/jarvis_onboarding_promotion_step1
        inputset:
          applicationId:          ${{ parameters.applicationId }}
          cloudType:              ${{ parameters.cloudType }}
          division:               ${{ parameters.division }}
          promotedFromRegion:     ${{ parameters.promotedFromRegion }}
          demandTicket:           ${{ parameters.demandTicket }}
          promotedFromEnviroment: ${{ parameters.promotedFromEnviroment }}
          qualysScan:             ${{ parameters.qualysScan }}
          elaborationProcess:     ${{ parameters.elaborationProcess }}
          applicationStage:       ${{ parameters.applicationStage }}
          isOnboardingSkipped:    ${{ parameters.isOnboardingSkipped }}
          applicationName:        ${{ parameters.applicationName }}
          environment:            ${{ parameters.environment }}
          multiRegionDeployment:  ${{ parameters.multiRegionDeployment }}
